<div id="main">
    <div id="top">
        <app-header-component></app-header-component>
        <br>
        <form (submit)="buscarRuta()">
            <mat-form-field >
                <mat-label>Origen</mat-label>
                <input type="text" matInput [formControl]="origen" [matAutocomplete]="autoOrigen">
                <button type="button" mat-icon-button matSuffix (click)="modoSeleccion = 'origen'" [color]="modoSeleccion == 'origen' ? 'primary' : ''">
                    <mat-icon>location_on</mat-icon>
                </button>
            </mat-form-field>
            <mat-autocomplete #autoOrigen="matAutocomplete" (optionSelected)="seleccionarLugar($event.option.value, 'origen')">
                @for (lugar of resultadosOrigen; track lugar) {
                    <mat-option [value]="lugar">
                    {{ lugar.name }} - {{ lugar.city }}
                    </mat-option>
                }
            </mat-autocomplete>
            <mat-form-field>
                <mat-label>Destino</mat-label>
                <input type="text" matInput [formControl]="destino" [matAutocomplete]="autoDestino">
                <button type="button" mat-icon-button matSuffix (click)="modoSeleccion = 'destino'" [color]="modoSeleccion == 'destino' ? 'primary' : ''">
                    <mat-icon>location_on</mat-icon>
                </button>
            </mat-form-field>
            <mat-autocomplete #autoDestino="matAutocomplete" (optionSelected)="seleccionarLugar($event.option.value, 'destino')">
                @for (lugar of resultadosDestino; track lugar) {
                    <mat-option [value]="lugar">
                    {{ lugar.name }} - {{ lugar.city }}
                    </mat-option>
                }
            </mat-autocomplete>
            <button mat-raised-button color="primary" type="submit"><mat-icon>search</mat-icon>Buscar</button>
        </form>
        <mat-card class="example-card" appearance="outlined">
            <div><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M338.5-138.5Q280-197 280-280q0-48 21-89.5t59-70.5v-320q0-50 35-85t85-35q50 0 85 35t35 85v320q38 29 59 70.5t21 89.5q0 83-58.5 141.5T480-80q-83 0-141.5-58.5ZM440-520h80v-40h-40v-40h40v-80h-40v-40h40v-40q0-17-11.5-28.5T480-800q-17 0-28.5 11.5T440-760v240Z"/></svg>{{temp}}º C</div>

    </div>
    <div id="bottom">
        <div id="map"></div>
    </div>
</div>
